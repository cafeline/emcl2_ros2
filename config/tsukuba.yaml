# ros2 param set /tvvf_vo_c_node repulsive_strength 0.4
# ros2 param set /tvvf_vo_c_node repulsive_influence_range 1.0

/**:
  ros__parameters:
    use_sim_time: true

emcl2:
  ros__parameters:
    map_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    pointcloud_topic: "/pointcloud/cut"
    map_hdf5_path: "/home/ryo/ros2_ws/src/emcl2_ros2/maps/tsukuba20251004_vram8gb.h5"
    transform_tolerance: 0.2
    odom_freq: 10
    num_particles: 1000
    initial_pose_x: 32.43
    initial_pose_y: 39.85
    initial_pose_yaw: 1.82
    initial_std_xy: 0.5
    initial_std_yaw: 0.5
    sensor_offset_x: 0.0
    sensor_offset_y: 0.0
    sensor_offset_z: 0.0
    sensor_roll: 0.0
    sensor_pitch: 0.0
    sensor_yaw: 0.0
    odom_fw_dev_per_fw: 0.19
    odom_fw_dev_per_rot: 0.0001
    odom_rot_dev_per_fw: 0.13
    odom_rot_dev_per_rot: 0.2

pointcloud2_cutter:
  ros__parameters:
    input_pointcloud_topic: "/livox/lidar"
    filtered_pointcloud_topic: "pointcloud/cut"
    output_filtered_pointcloud_topic: "pointcloud/cut"
    pose_topic: "/mcl_pose"
    scan_frame_id: "lidar_link"
    output_frame_id: "lidar_link"
    publish_scan: true
    output_scan_topic: "scan"
    scan_height_min: -0.15
    scan_height_max: 0.5
    scan_angle_min: -2.0
    # scan_angle_min: -3.141592653589793
    scan_angle_max: 2.0
    # scan_angle_max: 3.141592653589793
    scan_angle_increment: 0.005
    scan_range_min: 0.05
    scan_range_max: 10.0
    default_laser_height_min: 2.0
    default_laser_height_max: 50.0
    max_filtered_points: 3000
    regions_config_path: "/home/ryo/ros2_ws/install/share/pointcloud2_cutter/config/tsukuba_regions.yaml"

obstacle_tracker:
  ros__parameters:
    robot_processing_range: 6.0  # ロボット周囲で処理する最大距離[m]
    dynamic_cluster_speed_threshold: 0.0  # 動的障害物と判定する速度しきい値[m/s]
    voxel_size: 0.2  # 領域離散化のボクセルサイズ[m]
    clustering_max_distance: 0.3  # DBSCANで同一クラスタとみなす最大距離[m]
    min_cluster_points: 2  # クラスタ形成に必要な最少点数
    processing_frequency: 10.0  # レーザースキャン処理の周波数[Hz]
    max_computation_time: 0.15  # 1周期あたりの許容計算時間[s]
    enable_adaptive_dbscan: true  # 距離に応じてクラスタ閾値を変化させるか
    dbscan_base_eps: 0.3  # アダプティブDBSCANの基準半径[m]
    dbscan_min_points: 3  # DBSCANで必要な最小点数
    distance_adaptive_factor: 0.05  # 距離に応じた半径拡張係数
    max_angular_difference: 0.2  # クラスタ方向変化を許容する最大角度[rad]
    enable_enhanced_tracking: true  # 速度平滑化などの拡張追跡を有効化
    velocity_smoothing_alpha: 0.3  # 速度の指数移動平均係数
    confidence_decay_rate: 0.1  # 観測が途切れた際の信頼度減衰率
    max_missing_frames: 10  # 追跡を維持できる未検出フレーム数
    enable_sliding_window: true  # スライディングウィンドウバッファを使用
    sliding_window_size: 2  # 保持するフレーム数
    min_voxel_observations: 2  # 有効ボクセルとみなす最小観測回数

tvvf_vo_c_node:
  ros__parameters:
    vector_field_path_width: 4.0 # パス幅 [m]
    max_linear_velocity: 0.5  # 最大並進速度[m/s]
    max_angular_velocity: 0.4  # 最大角速度[rad/s]
    robot_radius: 0.24  # ロボット半径[m]
    base_frame: "base_link"  # ロボットベースフレーム名
    global_frame: "map"  # グローバル座標系
    goal_tolerance: 0.5  # 目標位置許容誤差[m]
    repulsive_strength: 0.6  # 斥力の強さ
    repulsive_influence_range: 1.0  # 斥力の影響範囲[m]
    enable_global_repulsion: false  # グローバル場への斥力ブレンドを有効化
    vector_field_publish_interval: 2.5  # ベクトル場のパブリッシュ間隔[s]
    map_repulsion_enabled: true  # OccupancyGridを斥力に利用
    map_repulsion_max_distance: 6.0  # ロボット周囲のみマーカー化する距離[m]
    map_repulsion_sampling_step: 0.5  # セルサンプリング間隔[m]
    map_repulsion_recompute_distance: 0.8  # ロボット移動で再計算する距離[m]
    map_repulsion_occupancy_threshold: 50  # 占有セル判定閾値
    publish_map_obstacle_markers: true  # map由来障害物マーカーを出力

velocity_smoother:
  ros__parameters:
    time_constant: 0.2
    command_timeout: 0.5
    max_linear_speed: 0.5
    max_angular_speed: 0.4
    publish_frequency: 30.0
    base_frame: "base_link"
    raw_cmd_topic: "cmd_vel_raw"
    filtered_cmd_topic: "cmd_vel"
    marker_topic: "cmd_vel_marker"
    marker_scale_y: 0.5
    marker_scale_z: 0.8
    marker_color: [0.0, 0.8, 1.0, 0.9]

waypoint_follower_node:
  ros__parameters:
    waypoint_csv_path: "/home/ryo/ros2_ws/src/raspicat_tvvf_navigation/maps/tsukuba_WP_1.csv"
    position_tolerance: 4.5
    orientation_tolerance: 3.14
    max_retry_count: 3  # 1ウェイポイントにつき再挑戦する最大回数
    goal_timeout: 30.0  # 各ウェイポイントで待機する最大時間[s]
    auto_start: true  # ノード起動直後に自動で巡航を開始するフラグ
    enable_skip_on_timeout: true  # タイムアウト発生時に該当ウェイポイントをスキップするか
    loop_navigation: false  # 最終ウェイポイント到達後に再び先頭へ戻るか
    global_frame: "map"  # ウェイポイントを表現するグローバルTFフレーム
    robot_base_frame: "base_link"  # ロボットベースのTFフレーム名
    use_sim_time: true  # シミュレーション時間を使用するかどうか

map_server:
  ros__parameters:
    map_yaml_path: "/home/ryo/ros2_ws/install/share/raspicat_tvvf_navigation/maps/navigation_map_2_edge_stopline.yaml"

vq_server:
  ros__parameters:
    frame_id: "map"
    marker_topic: "compressed_map_markers"
    marker_color_rgba: [0.1, 0.8, 0.4, 0.30]
    map_file: "/home/ryo/ros2_ws/install/share/vq_server/maps/tsukuba20251004_vram8gb_voxel05.h5"
